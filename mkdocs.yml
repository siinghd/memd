# The docs site. Build: pip install -e ".[docs]" && mkdocs build --strict
# Pages include the repository's markdown (README-engine.md, SECURITY.md,
# BENCHMARKS.md, CHANGELOG.md, sdk-ts/README.md, examples/) instead of
# copying it; scripts/docs_hooks.py fixes up their links and renders the
# HTTP reference from the server's own OpenAPI schema.
site_name: memd
site_description: The SQLite of agent memory - an embedded-first, Apache-2.0 agent memory engine
# placeholders until the repository exists: set repo_url (and site_url once
# the Pages URL or a custom domain is known) - see RELEASING.md
repo_url: https://github.com/memd/memd
repo_name: memd/memd
edit_uri: edit/master/docs/
copyright: memd contributors - Apache-2.0

docs_dir: docs
strict: true

extra:
  # the branch repo links in included files point at (scripts/docs_hooks.py)
  source_branch: master

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  - include-markdown:
      # an included file's relative links are rebased onto the including page
      rewrite_relative_urls: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Examples: examples.md
  - Reference:
      - Python API: reference/python.md
      - HTTP API: reference/http.md
      - TypeScript SDK: reference/typescript.md
      - MCP server: reference/mcp.md
  - Operations: operations.md
  - Security: security.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md
