[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memd"
version = "0.3.1"
description = "memd - embedded-first agent memory engine: raw+fact lanes, bitemporal supersedence, provenance/trust tiers, hybrid retrieval"
readme = "README-engine.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "memd contributors" }]
keywords = ["agent", "memory", "llm", "retrieval", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
s3 = ["boto3>=1.34"]
local-embeddings = ["fastembed>=0.4"]
# tantivy lexical accelerator for the bm25 lane (FTS5 stays the source of truth)
fast = ["tantivy>=0.26"]
# usearch HNSW sidecar for the vector lane (SQLite vectors stay the source of
# truth); >= 2.25: earlier versions slowed ~90x on ascending sparse int keys
ann = ["usearch>=2.25"]
# Jev reranker (TypeSafe System One); active only when TYPESAFE_API_KEY is set
jev = ["typesafe-sdk>=0.7"]
# hosted mode only (memd serve --http --hosted): Stripe billing. Imported
# lazily; embedded and self-hosted memd never import it.
billing = ["stripe>=15"]
# moto[server]: the aws-kms provider tests (in-process) and the multi-node
# router tests (a moto server the node processes share)
dev = ["pytest>=8", "pytest-timeout>=2", "stripe>=15", "moto[server]>=5"]

[project.scripts]
memd = "memd.cli:main"

[project.urls]
Homepage = "https://github.com/memd/memd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
markers = [
  "s3: requires an S3-compatible endpoint (set MEMD_TEST_S3_ENDPOINT; CI runs MinIO)",
  "slow: minutes-long fuzzing (the crash oracle); skipped unless MEMD_RUN_SLOW=1 or -m slow",
]

[tool.bandit]
# B608 (SQL via string building) is excluded after audit: every dynamic SQL
# fragment interpolates ONLY '?' placeholder lists and internal column names;
# all values are bound parameters (see tests/test_security_deep.py::test_sqli_*).
skips = ["B608"]
