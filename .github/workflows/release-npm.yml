name: Release (npm)

# On a version tag (or a manual run from the default branch): run the
# sdk-ts checks, then publish memd-engine with npm provenance. The SDK is
# versioned on its own (sdk-ts/package.json), so a run publishes it only when
# that version is not on npm yet; bump it in package.json to release a new
# one (RELEASING.md). Authentication is npm trusted publishing (OIDC): npm
# trusts this workflow in the `npm` environment of siinghd/memd, and the run
# gets a short-lived credential. No npm token is stored.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: sdk-ts checks
    uses: ./.github/workflows/sdk-ts.yml

  publish-npm:
    name: publish memd-engine
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write   # trusted publishing (OIDC) and npm provenance
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json
      - run: npm ci
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1 && npm --version
      - name: Decide whether to publish
        id: plan
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish (bump sdk-ts/package.json to release)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $name@$version"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # prepack runs the build; check:dist verifies what the tarball holds
      - if: steps.plan.outputs.publish == 'true'
        run: npm run build && npm run check:dist
      - if: steps.plan.outputs.publish == 'true'
        run: npm publish --provenance --access public
