name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.lexical }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the declared floor: the core install, bm25 lane on FTS5
          - python: "3.11"
            extras: "dev,mcp"
            lexical: fts5
          # 3.12 matches the Dockerfile, with memd[fast]: without it every
          # tantivy test skips and the accelerator ships untested
          - python: "3.12"
            extras: "dev,mcp,fast"
            lexical: tantivy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Assert the lexical backend under test
        run: |
          python -c "from memd.index.tantivy_lexical import resolve_lexical_backend as r; \
          got = r({}); assert got == '${{ matrix.lexical }}', got; print('lexical backend:', got)"
      - name: Unit + regression suite
        run: python -m pytest tests/ -q --timeout=600
      - name: Assert the tantivy tests actually ran
        if: matrix.lexical == 'tantivy'
        run: |
          # no explicit -q: pyproject's addopts supplies one (see the s3 job)
          out=$(python -m pytest tests/test_tantivy_lexical.py --no-header 2>&1)
          echo "$out" | tail -3
          if echo "$out" | grep -qE "[0-9]+ skipped"; then
            echo "::error::tantivy tests were SKIPPED - memd[fast] is not exercised"
            exit 1
          fi
          echo "$out" | grep -qE "[0-9]+ passed" || { echo "::error::no tantivy tests ran"; exit 1; }
      - name: Eval gate (accuracy, cost, adversarial zero-regression)
        run: python -m memd.harness.run --suite all --gate
      - name: Eval gate at other seeds and scales
        run: |
          python -m memd.harness.run --suite all --gate --seed 123 --users 12
          python -m memd.harness.run --suite all --gate --seed 99 --users 20
      - name: Ten-minute story (fresh dir -> cross-session recall)
        run: bash scripts/ten_minute_test.sh
      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-results-py${{ matrix.python }}-${{ matrix.lexical }}
          path: harness-results/
          if-no-files-found: ignore
          retention-days: 14

  s3:
    name: engine on a real S3 API (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,s3]"
      # A service container cannot take a command, and MinIO needs one, so it
      # runs as a plain container instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
      # The s3 half skips per-test when the endpoint is unset, so the step can
      # report success having compared nothing. -p no:randomly + a strict
      # skip budget makes "the s3 backend was not actually exercised" a
      # FAILURE rather than a green tick.
      - name: ObjectStore contract suite (local AND s3 must agree)
        env:
          MEMD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: python -m pytest tests/test_objectstore_contract.py -q -rs --no-header
      - name: Assert the s3 half actually ran
        env:
          MEMD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: |
          # NOTE: no explicit -q. pyproject's addopts already supplies one,
          # and a second makes pytest -qq, which suppresses the very summary
          # line this guard parses - the guard then passes on any outcome.
          out=$(python -m pytest tests/test_objectstore_contract.py -m s3 --no-header 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "[0-9]+ skipped"; then
            echo "::error::s3 contract tests were SKIPPED - the backend was not exercised, so 'local AND s3 agree' proved nothing"
            exit 1
          fi
          if ! echo "$out" | grep -qE "[0-9]+ passed"; then
            echo "::error::no s3 contract tests ran"
            exit 1
          fi
      - name: Engine on S3
        env:
          MEMD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: python -m pytest tests/test_s3_backend.py tests/test_pass32_s3_hardening.py -q
      # ADR-12: KMS-keyed node processes on one bucket (moto server as the
      # KMS): routing, SIGKILL/SIGTERM/SIGSTOP handoff, hosted metering
      - name: Multi-node router on S3
        env:
          MEMD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: python -m pytest tests/test_cluster_unit.py tests/test_cluster_router.py -q -rs
      - name: Hosted-path shape (informational)
        continue-on-error: true
        env:
          MEMD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: python bench/s3_bench.py | tee bench-s3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-s3
          path: bench-s3.json
          if-no-files-found: ignore
          retention-days: 30
      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true
      - name: Cleanup
        if: always()
        run: docker rm -f minio || true

  security:
    name: static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      # Fail on High/Medium only. The Low findings are audited, deliberate
      # degradation paths (try/except/pass around rebuildable state); B608 is
      # excluded in pyproject after audit - every dynamic SQL fragment
      # interpolates only '?' placeholder lists and internal column names.
      - name: bandit (fail on High/Medium)
        run: bandit -r src/memd -c pyproject.toml -ll -q

  package:
    name: build + clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # A stranger's experience: install the wheel into a bare venv and use it.
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import tempfile
          from memd import Memory
          m = Memory(tempfile.mkdtemp())
          m.add("We deploy with make ship, never CI", session_id="s1", user_id="u1")
          m.close_session("s1")
          hits = m.search("how do we deploy?", user_id="u1")
          assert hits.items, "cross-session recall failed from a clean install"
          m.close()
          print("clean install OK:", hits.items[0].content[:60])
          PY
          /tmp/clean/bin/memd --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  docker:
    name: image build + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t memd/memd:ci .
      # The image runs as uid 10001, so this uses a NAMED VOLUME. A bind mount
      # needs --user or a chown of the host dir; see README-engine.md.
      - name: Run and exercise the REST door
        run: |
          docker run -d --name memd-ci -p 8700:8700 \
            -e MEMD_ADMIN_KEY=ci-admin-key -v memd-ci-data:/data \
            memd/memd:ci serve --http
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8700/health >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8700/health
          H='Authorization: Bearer ci-admin-key'
          curl -sf -X POST http://127.0.0.1:8700/v1/ns/ci/memories -H "$H" \
            -H 'Content-Type: application/json' \
            -d '{"content":"we deploy with make ship, never CI","user_id":"u1"}'
          curl -sf -X POST http://127.0.0.1:8700/v1/ns/ci/search -H "$H" \
            -H 'Content-Type: application/json' \
            -d '{"query":"how do we deploy?","user_id":"u1"}' | grep -q packed_context
          echo "container smoke OK"
      - name: Logs on failure
        if: failure()
        run: docker logs memd-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f memd-ci || true
