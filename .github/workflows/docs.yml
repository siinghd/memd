name: Docs

# Build the docs site (mkdocs.yml) and deploy it to GitHub Pages. Needs
# Pages enabled with "GitHub Actions" as the source (RELEASING.md). Pull
# requests are covered by the docs job in ci.yml.

on:
  push:
    # whichever of the two is the default branch
    branches: [master, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - "examples/**"
      - "sdk-ts/README.md"
      - "src/**"
      - "scripts/docs_hooks.py"
      - "scripts/gen_openapi.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; never cancel one that is in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # memd itself too: the HTTP reference is rendered from its OpenAPI schema
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
