name: Nightly real-data gate

# Retrieval quality on REAL conversations, which the per-PR synthetic
# harness cannot see (a bm25 lane that ranked by distinct query-term coverage
# passed it and scored 0.739 ndcg@5 on LongMemEval). Unlike bench.yml this
# job FAILS when quality regresses: session ndcg_any@5 < 0.80 on 60 fixed
# LongMemEval_S questions, hash embedder, no reranker. Nightly only - it
# downloads ~280MB and ingests ~30K turns - and it skips cleanly when the
# dataset cannot be fetched.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  lme-gate:
    # both bm25 backends: `auto` picks tantivy wherever memd[fast] is
    # installed, so gating FTS5 alone left the default lane unmeasured
    name: LongMemEval_S gate (hash, no reranker, ${{ matrix.lexical }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lexical: [fts5, tantivy]
    env:
      MEMD_LME_CACHE: ${{ github.workspace }}/.lme-cache
      MEMD_RERANKER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,fast]"
      - uses: actions/cache@v4
        with:
          path: .lme-cache
          key: longmemeval-s-cleaned-v1
      # an explicit lexical backend never falls back: tantivy missing fails here
      - name: Gate (fails below ndcg_any@5 0.80)
        run: >-
          python bench/lme_gate.py --embedder hash --reranker none
          --lexical ${{ matrix.lexical }} --out lme-gate-${{ matrix.lexical }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lme-gate-${{ matrix.lexical }}-${{ github.run_number }}
          path: lme-gate-${{ matrix.lexical }}.json
          if-no-files-found: ignore
          retention-days: 90
