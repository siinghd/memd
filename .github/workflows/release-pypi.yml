name: Release (PyPI)

# On a version tag (v0.3.2): gate on the suite, build the sdist and wheel,
# check them, publish to PyPI with trusted publishing (OIDC, no stored
# token), and attach them to a GitHub Release. Before the first tag, see
# RELEASING.md: the PyPI project needs a trusted publisher for this
# workflow and the `pypi` environment, and the distribution name `memd` is
# already taken on PyPI by another project, so [project].name must change
# to a free name first.
#
# workflow_dispatch builds and checks everything but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Never cut a release from a red tree.
  verify:
    name: suite, eval gate, ten-minute story
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,mcp]"
      - name: Suite
        run: python -m pytest tests/ -q --timeout=600
      - name: Eval gate
        run: python -m memd.harness.run --suite all --gate
      - name: Ten-minute story
        run: bash scripts/ten_minute_test.sh

  build:
    name: build + check sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
          init=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/memd/__init__.py').read())[1])")
          if [ "$init" != "$version" ]; then
            echo "::error::memd.__version__ is $init, pyproject says $version"
            exit 1
          fi
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Clean-install smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import memd, tempfile; memd.Memory(tempfile.mkdtemp()).close(); print('memd', memd.__version__)"
          /tmp/clean/bin/memd --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the PyPI trusted publisher is bound to this workflow file and this
    # environment name; add required reviewers to the environment on GitHub
    # to make every publish wait for an approval
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
